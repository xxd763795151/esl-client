spring:
  application:
    name: esl-example
  lifecycle:
    # must exceed esl.outbound.shutdown-timeout so active calls can finish
    timeout-per-shutdown-phase: 40s

esl:
  inbound:
    enabled: true
    name: fs1
    addresses:
      - 127.0.0.1:8021
    password: ClueCon
    events:
      - CHANNEL_ANSWER
      - CHANNEL_HANGUP_COMPLETE
    reconnect:
      strategy: exponential
      initial-delay: 1s
      max-delay: 30s
    disconnected-command-policy: queue-until-ready
  outbound:
    port: 8084
    linger: 5s
    shutdown-timeout: 30s
  threads:
    io-threads: 2
